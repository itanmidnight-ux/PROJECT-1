# CyberScope WiFi — Configuration
# WiFi Security Auditing Platform

platform:
  name: "CyberScope WiFi"
  version: "2.0.0"

logging:
  level: INFO
  file: logs/cyberscope.log

discovery:
  capabilities_path: logs/capabilities.json

database:
  path: database/cyberscope.db

reports:
  output_dir: reports
  formats: [json, markdown]

wifi:
  scan_timeout: 15
  passive_only: false
  monitor_mode: true
  channels: "all"
  scan_methods: ["nmcli", "iw", "iwlist"]

attack:
  pmkid_timeout: 120
  deauth_timeout: 60
  wps_timeout: 300
  crack_timeout: 300
  wordlist: "/usr/share/wordlists/rockyou.txt"
  use_hashcat: false

ai:
  risk_threshold_high: 65
  risk_threshold_critical: 85